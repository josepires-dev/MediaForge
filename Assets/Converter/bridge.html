<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'">
  <title>MediaForge document converter</title>
</head>
<body>
  <script type="module">
    import initialize, { formatFromExtension, toMarkdownBytes } from "./wasm/anydoc_wasm.js";

    await initialize();
    window.chrome.webview.postMessage({ type: "ready" });
    window.chrome.webview.addEventListener("message", async ({ data }) => {
      if (data?.type !== "convert") return;
      try {
        const response = await fetch(`/inputs/${encodeURIComponent(data.fileName)}`);
        if (!response.ok) throw new Error(`Não foi possível ler o documento (HTTP ${response.status}).`);
        const bytes = new Uint8Array(await response.arrayBuffer());
        const markdown = toMarkdownBytes(bytes, formatFromExtension(data.extension));
        if (typeof markdown !== "string" || markdown.trim() === "") {
          throw new Error("Não foi possível obter conteúdo Markdown do documento.");
        }
        window.chrome.webview.postMessage({ type: "result", id: data.id, markdown });
      } catch (error) {
        window.chrome.webview.postMessage({
          type: "error",
          id: data.id,
          message: error instanceof Error ? error.message : "Erro desconhecido no conversor de documentos."
        });
      }
    });
  </script>
</body>
</html>
