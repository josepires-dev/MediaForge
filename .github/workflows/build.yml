name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache de pacotes NuGet
        uses: actions/cache@v6
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json', 'nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache das ferramentas (FFmpeg, Pandoc)
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\mediaforge-tools-cache
          key: tools-${{ hashFiles('scripts/tools.lock.json') }}

      - name: Obter ferramentas (FFmpeg, Pandoc)
        shell: pwsh
        run: ./scripts/fetch-tools.ps1

      - name: Build + smoke tests
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release

      - name: Diagnóstico do ambiente (doctor)
        shell: pwsh
        run: ./scripts/doctor.ps1 -Configuration Release

      - name: Publish (pasta + MSIX não assinado)
        shell: pwsh
        run: ./scripts/publish.ps1

      - name: Instalador Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\MediaForge.iss

      - uses: actions/upload-artifact@v4
        with:
          name: MediaForge-publish
          path: artifacts/publish

      - uses: actions/upload-artifact@v4
        with:
          name: MediaForge-msix
          path: AppPackages
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: MediaForge-installer
          path: artifacts/installer
          if-no-files-found: warn
